<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <meta name="description" content="HearthLedger is the Alvarez household's offline budget planner.">
  <title>HearthLedger</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-layout">
      <a class="brand" href="#/" aria-label="HearthLedger overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13 14 5l10 8M7 12v11h14V12M11 19v-3m3 3v-5m3 5v-7"/>
          </svg>
        </span>
        <span>Hearth<span class="brand-ledger">Ledger</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a href="#/transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4 4-4-4 4-4"/></svg>
          Transactions
        </a>
        <a href="#/budgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4m3 0h3"/></svg>
          Budgets
        </a>
        <a href="#/goals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.75"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          Goals
        </a>
        <a href="#/insights">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15l4-5 3 2 5-6"/></svg>
          Insights
        </a>
      </nav>
      <div class="month-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4m8-4v4M4 10h16"/></svg>
        <time id="active-month" datetime="2026-11">November 2026</time>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <noscript>Enable JavaScript to use the household ledger.</noscript>
  </main>

  <footer class="wrap site-footer">
    <span id="storage-status" class="storage-status"></span>
    <button id="reset-demo" class="text-button" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v5h5M4.4 10a8 8 0 1 1 .6 6"/></svg>
      Reset demo data
    </button>
  </footer>
  <p id="notice" class="notice" role="status" aria-atomic="true"></p>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="charts.js"></script>
  <script src="views.js"></script>
  <script src="main.js"></script>
</body>
</html>
